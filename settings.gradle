pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroup('net.fabricmc')
                includeGroup('net.fabricmc.unpick')
                includeGroup('fabric-loom')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups("org.spongepowered")
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
    id 'fabric-loom' version '1.15-SNAPSHOT' apply false
}

// Force snakeyaml to resolve from Maven Central, not libraries.minecraft.net
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        exclusiveContent {
            forRepository {
                mavenCentral()
            }
            filter {
                includeGroup('org.yaml')
            }
        }
        maven {
            name = 'AliyunMirror'
            url = uri('https://maven.aliyun.com/repository/public')
        }
        maven {
            name = 'FabricMC'
            url = uri('https://maven.fabricmc.net')
        }
        maven {
            name = 'MinecraftLibraries'
            url = uri('https://libraries.minecraft.net')
        }
    }
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = "Teleport Commands"
include("common")
include("fabric")
//include("neoforge") // disabled
//include("quilt") // disabled since the fabric port works better then the native quilt port