// All supported Minecraft projects compile the same maintained implementation.
def repositoryRoot = rootProject.file('versions').isDirectory()
        ? rootProject.projectDir : rootProject.file('../..')
sourceSets {
    main {
        java.setSrcDirs([new File(repositoryRoot, 'fabric/src/main/java')])
        resources.setSrcDirs([new File(repositoryRoot, 'fabric/src/main/resources')])
    }
    test.java.setSrcDirs([new File(repositoryRoot, 'fabric/src/test/java')])
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
if (project.minecraft_version != '1.21.11') {
    loom.accessWidenerPath = new File(repositoryRoot, 'fabric/src/main/resources/tpa.accesswidener')
}
