name: Build all Minecraft versions
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.11', '26.1', '26.1.1', '26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile and package
        run: bash ./gradlew -p versions/${{ matrix.minecraft }} :fabric:build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tpa-${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/fabric/build/libs/*.jar
